# token-gateway: replicas 3-10 with HPA. The bouncer scales; the vault doesn't.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: token-gateway
  namespace: aura-gateway
spec:
  replicas: 3
  selector:
    matchLabels: { app: token-gateway }
  template:
    metadata:
      labels: { app: token-gateway }
    spec:
      containers:
        - name: token-gateway
          image: aura/token-gateway:latest
          ports:
            - containerPort: 3000

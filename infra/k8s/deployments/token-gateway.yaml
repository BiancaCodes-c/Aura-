apiVersion: apps/v1
kind: Deployment
metadata: {name: aura-gateway, namespace: aura-gateway}
spec:
  replicas: 3
  selector: {matchLabels: {app: aura-gateway}}
  template:
    metadata: {labels: {app: aura-gateway}}
    spec:
      containers:
      - name: gateway
        image: aura/gateway:latest
        ports: [{containerPort: 3000}]
        env: [{name: CORE_URL, value: "http://identity-core.aura-core.svc.cluster.local:4000"}]

apiVersion: apps/v1
kind: Deployment
metadata: {name: identity-core, namespace: aura-core}
spec:
  replicas: 1
  selector: {matchLabels: {app: identity-core}}
  template:
    metadata: {labels: {app: identity-core}}
    spec:
      containers:
      - name: core
        image: aura/core:latest
        ports: [{containerPort: 4000}]
        env: [{name: RETENTION_SECONDS, value: "60"}]

# gateway-only: the gateway can talk to core + the internet — and nothing else sideways.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-only
  namespace: aura-gateway
spec:
  podSelector:
    matchLabels: { app: token-gateway }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { aura: core }
      ports:
        - port: 4000
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - port: 443

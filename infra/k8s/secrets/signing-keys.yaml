# SealedSecret — the Ed25519 signing keys live sealed; only the controller unseals them in-cluster.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: aura-signing-keys
  namespace: aura-core
spec:
  encryptedData:
    private-key: "REPLACE-WITH-SEALED-VALUE"
  template:
    metadata:
      name: aura-signing-keys

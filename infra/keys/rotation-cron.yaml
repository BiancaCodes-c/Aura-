# Ed25519 signing-key rotation — every 24h.
# Old public keys stay published until every token signed with them expires.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aura-key-rotation
  namespace: aura-core
spec:
  schedule: "0 0 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: rotate
              image: aura/identity-core:latest
              command: ["node", "dist/keys.js", "--rotate"]
